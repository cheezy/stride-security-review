name: eval

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - 'commands/**'
      - 'skills/**'
      - 'test/fixtures/**'
      - 'test/golden/**'
      - 'scripts/**'
      - '.github/workflows/eval.yml'
  pull_request:
    paths:
      - 'agents/**'
      - 'commands/**'
      - 'skills/**'
      - 'test/fixtures/**'
      - 'test/golden/**'
      - 'scripts/**'
      - '.github/workflows/eval.yml'

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    # One sequential claude call per fixture. The recorded considerations run
    # (EXPECTED.md "Recorded runs") averaged about 11 s a fixture; full-file
    # fixtures are larger, so allow headroom for the whole suite.
    timeout-minutes: 45
    steps:
      # actions/checkout v4.2.2 — pin to commit SHA, the plugin flags floating tags.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-node v4.1.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '20'

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # Fixture/EXPECTED.md parity guard — no API key, no Claude CLI. Runs first
      # so a fixture added without its EXPECTED.md row (or vice versa) fails fast
      # and cheap, before any API spend.
      - name: Check fixture/EXPECTED.md parity
        run: bash scripts/check_fixtures.sh

      # Pure deterministic-transform tests — no API key, no Claude CLI. Runs
      # before the CLI install and the API-spending eval so a transform
      # regression fails fast and cheap.
      - name: Run transform tests
        run: bash scripts/run_transform_tests.sh

      # Text pins on the agent's SECURITY_RESULT_PATH contract (W2284), its
      # considerations-mode rules (W2275) and its read-only tool contract
      # (W2276) — no API key, no Claude CLI.
      - name: Check the agent contract
        run: bash scripts/check_agent_contract.sh

      # The eval's claude invocation loads THIS repo's security-reviewer agent
      # (--plugin-dir + --agent), runs it from an isolated cwd, and gates on auth
      # (W2274) — checked against a fake CLI, so no API key and no Claude CLI.
      # It also executes the "Detect ANTHROPIC_API_KEY" script below for each
      # event, so the skip-on-PR / fail-on-main gate is tested, not just read.
      - name: Check the eval invocation
        run: bash scripts/check_eval_invocation.sh

      # Fails loudly on main, skips quietly on pull requests. The agent eval below
      # needs ANTHROPIC_API_KEY; everything above does not.
      # - push to main / workflow_dispatch: a missing key is a configuration
      #   error, so the job FAILS (::error + exit 1) instead of skipping. A green
      #   run on main therefore always means the agent eval actually ran.
      # - pull_request: GitHub withholds secrets from fork PRs (and Dependabot
      #   PRs), so a missing key there is expected — emit a notice and skip the
      #   CLI install + eval; the key-free checks above have already run.
      # The event name comes in through env, never through a template expression
      # inside `run:`. The key's value is only ever tested for emptiness.
      - name: Detect ANTHROPIC_API_KEY
        id: apikey
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Agent eval skipped::ANTHROPIC_API_KEY is not available to this pull request (fork and Dependabot PRs get no secrets) — skipping the Claude CLI install and the agent eval (scripts/run_eval.sh). The key-free checks still ran and passed."
          else
            echo "::error title=Agent eval cannot run::ANTHROPIC_API_KEY is not configured for this repository, so the agent eval (scripts/run_eval.sh) cannot run on ${EVENT_NAME}. Add the secret under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install Claude Code CLI
        if: steps.apikey.outputs.present == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run eval
        if: steps.apikey.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash scripts/run_eval.sh

      # actions/upload-artifact v4.4.3 — upload logs on failure for triage.
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: eval-logs
          path: logs/
          retention-days: 14
